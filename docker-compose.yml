services:
  mongo:
      image: mongo:6
      restart: always
      volumes:
        - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Remove host port mapping since we'll access through Nginx
    expose:
      - "5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo

  transactions:
    build:
      context: ./transactions
      dockerfile: Dockerfile
    expose:
      - "3000"  # Expose for debugging
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=3000  # Explicitly set port
    depends_on:
      - mongo

  # Frontend service (serves static files)
  studentportfolio:
    build:
      context: ./studentportfolio
      dockerfile: Dockerfile
    expose:
      - "80"

  # Dedicated Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Main entry point for all traffic
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mongo
      - backend
      - transactions
      - studentportfolio

volumes:
  mongo_data: